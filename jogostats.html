<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas do Jogo - Liga Will Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/jogostats.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
   
    <button class="back-btn" onclick="history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Voltar
    </button>

    <span class="topbar-title" id="topbar-game-label">Estatísticas do Jogo</span>
    <img src="Images/Logo wil.svg" alt="LWS" class="topbar-logo">
    
</div>

<!-- SCOREBOARD -->
<div class="hero">
    <div class="scoreboard">
       
        <div class="team-block" id="home">
            <div class="team-name" id="home-name">Rays Basquete</div>
            <div class="team-score" id="home-score">41</div>
        </div>
       
        <div class="center-divider">
            <div class="divider-line"></div>
            <div class="vs-text">VS</div>
            <div class="divider-line"></div>
        </div>

        <div class="team-block winner" id="away">
            <div class="team-name" id="away-name">VF Hoopers</div>
            <div class="team-score" id="away-score">44</div>
        </div>
        
    </div>
</div>

<!-- CONTENT -->
<div class="content">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        
        <!-- HOME TEAM STATS -->
        <div>
            <div class="section-header">
                <h3 id="home-stats-title">Rays Basquete</h3>
                <span class="team-tag">Casa</span>
            </div>
            <div class="stats-table-wrap">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th>PTS</th>
                            <th>REB</th>
                            <th>AST</th>
                            <th>BLK</th>
                            <th>ROU</th>
                        </tr>
                    </thead>
                    <tbody id="home-tbody">
                        <tr><td colspan="6"><div class="empty-state"><div class="icon">🏀</div><p>Nenhuma estatística inserida</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- AWAY TEAM STATS -->
        <div>
            <div class="section-header">
                <h3 id="away-stats-title">VF Hoopers</h3>
                <span class="team-tag away">Visitante</span>
            </div>
            <div class="stats-table-wrap">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th>PTS</th>
                            <th>REB</th>
                            <th>AST</th>
                            <th>BLK</th>
                            <th>ROU</th>
                        </tr>
                    </thead>
                    <tbody id="away-tbody">
                        <tr><td colspan="6"><div class="empty-state"><div class="icon">🏀</div><p>Nenhuma estatística inserida</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="page-footer">Temporada 2026 • Liga Will Sports</div>

<script>
    // ── STATE ──
    let state = {
        home: { name: "Rays Basquete", score: 41, players: [] },
        away: { name: "VF Hoopers", score: 44, players: [] },
        round: "Rodada 1",
        date: "29 de Março",
        winner: "away"
    };

    // ── TAB SYSTEM ──
    function showTab(id, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (btn) btn.classList.add('active');
        if (id === 'resumo') renderSummary();
    }

    // ── RENDER SCOREBOARD ──
    function renderScoreboard() {
        document.getElementById('home-name').textContent = state.home.name;
        document.getElementById('away-name').textContent = state.away.name;
        document.getElementById('home-score').textContent = state.home.score;
        document.getElementById('away-score').textContent = state.away.score;
        document.getElementById('hero-round').textContent = state.round;
        document.getElementById('hero-date').textContent = state.date;
        document.getElementById('topbar-game-label').textContent = `${state.home.name} vs ${state.away.name}`;

        // winner styles
        const hb = document.getElementById('home-block');
        const ab = document.getElementById('away-block');
        hb.classList.toggle('winner', state.winner === 'home');
        ab.classList.toggle('winner', state.winner === 'away');

        // tabs
        document.getElementById('tab-home-label').textContent = state.home.name;
        document.getElementById('tab-away-label').textContent = state.away.name;
        document.getElementById('home-stats-title').textContent = state.home.name;
        document.getElementById('away-stats-title').textContent = state.away.name;
        document.getElementById('sum-home-title').textContent = state.home.name;
        document.getElementById('sum-away-title').textContent = state.away.name;

        // select options
        document.getElementById('opt-home').textContent = state.home.name;
        document.getElementById('opt-away').textContent = state.away.name;

        // status pill
        const pill = document.getElementById('hero-status');
        if (state.winner === 'none') { pill.textContent = 'AO VIVO'; pill.style.background='rgba(0,230,118,0.15)'; pill.style.borderColor='rgba(0,230,118,0.4)'; pill.style.color='#00e676'; }
        else { pill.textContent = 'FIM DE JOGO'; pill.style.background=''; pill.style.borderColor=''; pill.style.color=''; }
    }

    // ── RENDER TABLE ──
    function renderTable(side) {
        const players = state[side].players;
        const tbody = document.getElementById(side + '-tbody');
        const cardsEl = document.getElementById(side + '-player-cards');

        if (players.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">🏀</div><p>Nenhuma estatística inserida ainda.<br>Vá em <strong>+ Inserir</strong> para adicionar.</p></div></td></tr>`;
            cardsEl.innerHTML = '';
            return;
        }

        // find top scorer
        const maxPts = Math.max(...players.map(p => p.pts));

        let rows = players.map((p, i) => {
            const ptsCell = p.pts === maxPts && p.pts > 0 ? `<span class="stat-top">${p.pts}</span>` : p.pts;
            return `<tr>
                <td><span class="jersey">${p.jersey || '#'}</span>${p.name}</td>
                <td>${ptsCell}</td>
                <td>${p.reb}</td>
                <td>${p.ast}</td>
                <td>${p.blk}</td>
                <td>${p.rou}</td>
                <td><button class="del-btn" onclick="deletePlayer('${side}', ${i})" title="Remover">✕</button></td>
            </tr>`;
        }).join('');

        // totals
        const totPts = players.reduce((a,b)=>a+b.pts, 0);
        const totReb = players.reduce((a,b)=>a+b.reb, 0);
        const totAst = players.reduce((a,b)=>a+b.ast, 0);
        const totBlk = players.reduce((a,b)=>a+b.blk, 0);
        const totRou = players.reduce((a,b)=>a+b.rou, 0);
        rows += `<tr class="totals-row">
            <td>TOTAL</td>
            <td>${totPts}</td>
            <td>${totReb}</td>
            <td>${totAst}</td>
            <td>${totBlk}</td>
            <td>${totRou}</td>
            <td></td>
        </tr>`;

        tbody.innerHTML = rows;

        // mobile cards
        cardsEl.innerHTML = players.map((p, i) => {
            return `<div class="player-card">
                <div class="player-card-header">
                    <div><span class="jersey" style="display:inline-block;background:rgba(204,0,0,0.2);color:#ff1a1a;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.75em;width:22px;height:22px;line-height:22px;text-align:center;border-radius:4px;margin-right:6px;">${p.jersey||'#'}</span><span class="player-card-name">${p.name}</span></div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="player-card-pts">${p.pts}<span>pts</span></div>
                        <button class="del-btn" onclick="deletePlayer('${side}', ${i})">✕</button>
                    </div>
                </div>
                <div class="player-stat-row">
                    <div class="player-stat-item"><span class="ps-label">REB</span><span class="ps-val">${p.reb}</span></div>
                    <div class="player-stat-item"><span class="ps-label">AST</span><span class="ps-val">${p.ast}</span></div>
                    <div class="player-stat-item"><span class="ps-label">BLK</span><span class="ps-val">${p.blk}</span></div>
                    <div class="player-stat-item"><span class="ps-label">ROU</span><span class="ps-val">${p.rou}</span></div>
                </div>
            </div>`;
        }).join('');
    }

    // ── RENDER SUMMARY ──
    function renderSummary() {
        ['home','away'].forEach(side => {
            const ps = state[side].players;
            const el = document.getElementById(side + '-summary');
            if (ps.length === 0) {
                el.innerHTML = `<div style="color:var(--muted);font-size:0.85em;grid-column:1/-1;">Sem dados.</div>`;
                return;
            }
            const totPts = ps.reduce((a,b)=>a+b.pts,0);
            const totReb = ps.reduce((a,b)=>a+b.reb,0);
            const totAst = ps.reduce((a,b)=>a+b.ast,0);
            const totBlk = ps.reduce((a,b)=>a+b.blk,0);
            const totRou = ps.reduce((a,b)=>a+b.rou,0);
            const topScorer = ps.reduce((a,b)=>a.pts>=b.pts?a:b);
            el.innerHTML = `
                <div class="summary-card accent"><div class="label">Pontos</div><div class="value">${totPts}</div></div>
                <div class="summary-card"><div class="label">Rebotes</div><div class="value">${totReb}</div></div>
                <div class="summary-card"><div class="label">Assistências</div><div class="value">${totAst}</div></div>
                <div class="summary-card"><div class="label">Bloqueios</div><div class="value">${totBlk}</div></div>
                <div class="summary-card"><div class="label">Roubos</div><div class="value">${totRou}</div></div>
            `;
        });

        // MVP
        const allPlayers = [
            ...state.home.players.map(p=>({...p, side:'home'})),
            ...state.away.players.map(p=>({...p, side:'away'}))
        ];
        if (allPlayers.length > 0) {
            const mvp = allPlayers.reduce((a,b)=>{
                const scoreA = a.pts*1 + a.reb*0.5 + a.ast*0.5 + a.blk*0.5 + a.rou*0.5;
                const scoreB = b.pts*1 + b.reb*0.5 + b.ast*0.5 + b.blk*0.5 + b.rou*0.5;
                return scoreA >= scoreB ? a : b;
            });
            const teamName = state[mvp.side].name;
            document.getElementById('mvp-section').innerHTML = `
                <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                    <div style="width:60px;height:60px;background:linear-gradient(135deg,#cc0000,#8b0000);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8em;flex-shrink:0;">⭐</div>
                    <div style="flex:1;">
                        <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.75em;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Destaque do Jogo</div>
                        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.8em;font-weight:900;">${mvp.name}</div>
                        <div style="font-size:0.85em;color:var(--muted);">${teamName}</div>
                    </div>
                    <div style="display:flex;gap:16px;flex-wrap:wrap;">
                        <div style="text-align:center;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:2.5em;font-weight:900;color:var(--green);">${mvp.pts}</div><div style="font-size:0.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">PTS</div></div>
                        <div style="text-align:center;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:2.5em;font-weight:900;">${mvp.reb}</div><div style="font-size:0.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">REB</div></div>
                        <div style="text-align:center;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:2.5em;font-weight:900;">${mvp.ast}</div><div style="font-size:0.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">AST</div></div>
                        <div style="text-align:center;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:2.5em;font-weight:900;">${mvp.blk}</div><div style="font-size:0.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">BLK</div></div>
                        <div style="text-align:center;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:2.5em;font-weight:900;">${mvp.rou}</div><div style="font-size:0.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">ROU</div></div>
                    </div>
                </div>
            `;
        } else {
            document.getElementById('mvp-section').innerHTML = `<div class="empty-state" style="padding:20px;"><div class="icon">⭐</div><p>Insira estatísticas para ver os destaques do jogo.</p></div>`;
        }
    }

    // ── ADD PLAYER ──
    function addPlayer() {
        const side   = document.getElementById('inp-team').value;
        const name   = document.getElementById('inp-name').value.trim();
        const jersey = document.getElementById('inp-jersey').value.trim();
        const pts    = parseInt(document.getElementById('inp-pts').value) || 0;
        const reb    = parseInt(document.getElementById('inp-reb').value) || 0;
        const ast    = parseInt(document.getElementById('inp-ast').value) || 0;
        const blk    = parseInt(document.getElementById('inp-blk').value) || 0;
        const rou    = parseInt(document.getElementById('inp-rou').value) || 0;

        if (!name) { alert('Por favor, insira o nome do jogador.'); return; }

        state[side].players.push({ name, jersey, pts, reb, ast, blk, rou });
        renderTable('home');
        renderTable('away');
        clearForm();

        const msg = document.getElementById('success-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 2500);
    }

    // ── DELETE PLAYER ──
    function deletePlayer(side, idx) {
        if (!confirm('Remover este jogador?')) return;
        state[side].players.splice(idx, 1);
        renderTable('home');
        renderTable('away');
    }

    // ── CLEAR FORM ──
    function clearForm() {
        ['inp-name','inp-jersey','inp-pts','inp-reb','inp-ast','inp-blk','inp-rou'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }

    // ── APPLY CONFIG ──
    function applyConfig() {
        const hName  = document.getElementById('cfg-home').value.trim();
        const aName  = document.getElementById('cfg-away').value.trim();
        const hScore = parseInt(document.getElementById('cfg-home-score').value);
        const aScore = parseInt(document.getElementById('cfg-away-score').value);
        const round  = document.getElementById('cfg-round').value.trim();
        const date   = document.getElementById('cfg-date').value.trim();
        const winner = document.getElementById('cfg-winner').value;

        if (hName) state.home.name = hName;
        if (aName) state.away.name = aName;
        if (!isNaN(hScore)) state.home.score = hScore;
        if (!isNaN(aScore)) state.away.score = aScore;
        if (round) state.round = round;
        if (date) state.date = date;
        state.winner = winner;

        renderScoreboard();
        alert('✓ Configurações aplicadas!');
    }

    // ── INIT ──
    renderScoreboard();
    renderTable('home');
    renderTable('away');
</script>
</body>
</html>
